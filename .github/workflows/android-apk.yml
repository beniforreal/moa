name: Build MOA Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate build configuration
        env:
          MOA_APP_URL: ${{ vars.MOA_APP_URL }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$MOA_APP_URL" || (echo "Repository variable MOA_APP_URL is required" && exit 1)
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || (echo "Secret GOOGLE_SERVICES_JSON_BASE64 is required" && exit 1)
          case "$MOA_APP_URL" in
            https://*) ;;
            *) echo "MOA_APP_URL must start with https://" && exit 1 ;;
          esac

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android-app/app/google-services.json

      - name: Build release APK
        working-directory: android-app
        env:
          MOA_APP_URL: ${{ vars.MOA_APP_URL }}
        run: gradle :app:assembleRelease -PMOA_APP_URL="$MOA_APP_URL" --no-daemon

      - name: Locate and rename APK
        run: |
          APK_PATH="$(find android-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH" || (echo "No APK found in release output" && find android-app/app/build/outputs -maxdepth 5 -type f -print && exit 1)
          echo "Using APK: $APK_PATH"
          cp "$APK_PATH" MOA.apk

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MOA-Android-APK
          path: MOA.apk
          if-no-files-found: error
          retention-days: 30
